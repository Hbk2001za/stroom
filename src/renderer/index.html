<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <div class="header">
      <button class="donate-toggle" onclick="openDonate()" title="Support Stroom">❤️ Donate</button>
      <img id="app-logo" src="logo.png" alt="Stroom">
      <button class="dark-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('single')">🎯 Single URL</button>
      <button class="tab" onclick="switchTab('batch')">📋 Batch URLs</button>
    </div>

    <!-- Single URL Tab -->
    <div id="tab-single" class="tab-content active">

      <!-- YouTube Video -->
      <div class="card">
        <label>🎬 YouTube Video URL</label>
        <div class="row">
          <input type="text" id="yt-video" placeholder="https://www.youtube.com/watch?v=...">
          <select id="quality-yt-video">
            <option value="best">Best</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
          <button id="btn-yt-video" onclick="download('yt-video', 'video')">Download</button>
          <button class="cancel-btn" id="cancel-yt-video" onclick="cancelDownload('yt-video')" style="display:none;">⏹</button>
        </div>
        <div class="progress-container" id="progress-yt-video">
          <div class="progress-bar"><div class="progress-fill" id="fill-yt-video"></div></div>
          <div class="progress-text" id="progress-text-yt-video"></div>
        </div>
        <span class="status" id="status-yt-video"></span>
      </div>

      <!-- YouTube MP3 -->
      <div class="card">
        <label>🎵 YouTube MP3 URL</label>
        <div class="row">
          <input type="text" id="yt-mp3" placeholder="https://www.youtube.com/watch?v=...">
          <select id="quality-yt-mp3">
            <option value="320">320kbps</option>
            <option value="256">256kbps</option>
            <option value="192">192kbps</option>
            <option value="128">128kbps</option>
          </select>
          <button id="btn-yt-mp3" onclick="download('yt-mp3', 'mp3')">Download</button>
          <button class="cancel-btn" id="cancel-yt-mp3" onclick="cancelDownload('yt-mp3')" style="display:none;">⏹</button>
        </div>
        <div class="progress-container" id="progress-yt-mp3">
          <div class="progress-bar"><div class="progress-fill" id="fill-yt-mp3"></div></div>
          <div class="progress-text" id="progress-text-yt-mp3"></div>
        </div>
        <span class="status" id="status-yt-mp3"></span>
      </div>

      <!-- Spotify -->
      <div class="card">
        <label>🟢 Spotify Song or Playlist</label>
        <div class="row">
          <input type="text" id="spotify-public" placeholder="https://open.spotify.com/track/... or /playlist/...">
          <select id="quality-spotify-public">
            <option value="320">320kbps</option>
            <option value="256">256kbps</option>
            <option value="192">192kbps</option>
            <option value="128">128kbps</option>
          </select>
          <button id="btn-spotify-public" onclick="download('spotify-public', 'spotify-public')">Download</button>
          <button class="cancel-btn" id="cancel-spotify-public" onclick="cancelDownload('spotify-public')" style="display:none;">⏹</button>
        </div>
        <div class="progress-container" id="progress-spotify-public">
          <div class="progress-bar"><div class="progress-fill" id="fill-spotify-public"></div></div>
          <div class="progress-text" id="progress-text-spotify-public"></div>
        </div>
        <span class="status" id="status-spotify-public"></span>
      </div>

      <!-- Generic / Any-Site -->
      <div class="card">
        <label>🌐 Any Site URL (TikTok, Instagram, X, SoundCloud, etc.) — Beta</label>
        <div class="row">
          <input type="text" id="generic-url" placeholder="Paste any link yt-dlp supports...">
          <select id="quality-generic-url">
            <option value="video">Video</option>
            <option value="audio">Audio (MP3)</option>
          </select>
          <button id="btn-generic-url" onclick="download('generic-url', 'generic')">Download</button>
          <button class="cancel-btn" id="cancel-generic-url" onclick="cancelDownload('generic-url')" style="display:none;">⏹</button>
        </div>
        <div class="progress-container" id="progress-generic-url">
          <div class="progress-bar"><div class="progress-fill" id="fill-generic-url"></div></div>
          <div class="progress-text" id="progress-text-generic-url"></div>
        </div>
        <span class="status" id="status-generic-url"></span>
      </div>

      <!-- Remove Vocals -->
      <div class="card">
        <label>🎤 Remove Vocals from Song (URL) — Beta</label>
        <div class="row">
          <input type="text" id="remove-vocals" placeholder="Paste a YouTube or any supported URL...">
          <button id="btn-remove-vocals" onclick="download('remove-vocals', 'remove-vocals')">Remove Vocals</button>
          <button class="cancel-btn" id="cancel-remove-vocals" onclick="cancelDownload('remove-vocals')" style="display:none;">⏹</button>
        </div>
        <div class="progress-container" id="progress-remove-vocals">
          <div class="progress-bar"><div class="progress-fill" id="fill-remove-vocals"></div></div>
          <div class="progress-text" id="progress-text-remove-vocals"></div>
        </div>
        <span class="status" id="status-remove-vocals"></span>
      </div>
    </div>

    <!-- Batch Tab -->
    <div id="tab-batch" class="tab-content">
      <!-- Drop Zone -->
      <div id="drop-zone">📥 Drag & drop URLs here — or paste below</div>
      <div class="card">
        <label>📋 Paste multiple URLs (one per line — don't mix YouTube and Spotify)</label>
        <textarea id="batch-urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=..."></textarea>
        <div class="row" style="margin-top:8px;">
          <select id="batch-type">
            <option value="mp3">YouTube → MP3</option>
            <option value="video">YouTube → Video</option>
            <option value="spotify-public">Spotify</option>
          </select>
          <select id="quality-batch">
            <option value="best">Best/320kbps</option>
            <option value="1080">1080p / 256kbps</option>
            <option value="720">720p / 192kbps</option>
            <option value="480">480p / 128kbps</option>
          </select>
          <button id="btn-batch" onclick="downloadBatch()">Download All</button>
          <button class="cancel-btn" id="cancel-batch" onclick="cancelDownload('batch')" style="display:none;">⏹ Stop All</button>
        </div>
        <div class="progress-container" id="progress-batch">
          <div class="progress-bar"><div class="progress-fill" id="fill-batch"></div></div>
          <div class="progress-text" id="progress-text-batch"></div>
        </div>
        <span class="status" id="status-batch"></span>
      </div>
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header">
        <h3>📜 Recent Downloads</h3>
        <div class="history-actions">
          <button class="history-btn" onclick="viewHistory()">View All</button>
          <button class="history-btn" onclick="downloadHistory()">📥 Export</button>
          <button class="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Folder & Update Buttons -->
    <div class="folder-row">
      <button class="folder-btn" onclick="chooseDownloadFolder()">📁 Choose Download Folder</button>
      <button class="folder-btn" onclick="openDownloadsFolder()">📂 Open Downloads Folder</button>
      <button class="folder-btn" id="update-tools-btn">🔧 Update Tools</button>
    </div>
    <div id="current-folder-display" class="folder-path"></div>

  </div>

  <!-- History Modal -->
  <div id="history-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📜 Download History</h3>
        <button class="modal-close" onclick="closeHistory()">✕</button>
      </div>
      <div class="modal-body" id="history-full-list"></div>
    </div>
  </div>

  <!-- Donate Modal -->
  <div id="donate-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>❤️ Support Stroom</h3>
        <button class="modal-close" onclick="closeDonate()">✕</button>
      </div>
      <div class="modal-body">
        <p class="donate-message">If Stroom has been useful to you, consider chipping in — it genuinely helps keep this project going. Thank you! 🙏</p>
        <div id="donate-list" class="donate-list"></div>
      </div>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
